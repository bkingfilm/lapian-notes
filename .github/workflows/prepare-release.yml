name: Publish approved v0.5.3
on:
  push:
    branches: [fix/windows-startup-issue-3]
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          ref: 6fe00381e20e7f5a7bd391097091f398e16f86fd
      - name: Verify existing package and publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download v0.5.3 --pattern lapian-notes-v0.5.3.zip --pattern SHA256SUMS.txt
          sha256sum -c SHA256SUMS.txt
          git archive --format=zip --prefix=lapian-notes/ HEAD -o expected.zip
          cmp expected.zip lapian-notes-v0.5.3.zip
          cat > notes.txt <<'NOTES'
          修复 Windows 下服务已启动却提示启动失败的问题。

          - 清理 Vite 输出中的颜色控制字符，正确识别启动地址。
          - 支持端口被占用后自动切换。
          - 本地检测绕过系统代理，失败时显示具体错误并停止本次进程。

          已通过完整 CI、打包校验，以及 Windows Server 2025 / PowerShell 5.1 的依赖安装、彩色日志、5173 与 5174 启动验证。
          Windows 11 用户机器、macOS 桌面启动及浏览器影片抽帧尚未完成实测，本次按维护者明确指示发布。

          下载附件 lapian-notes-v0.5.3.zip，解压后 Windows 运行 run.bat，macOS 运行 run.command。

          SHA256:
          NOTES
          cat SHA256SUMS.txt >> notes.txt
          gh release edit v0.5.3 --target 6fe00381e20e7f5a7bd391097091f398e16f86fd --draft=false --latest --notes-file notes.txt
