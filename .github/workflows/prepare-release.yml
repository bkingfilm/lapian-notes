name: Prepare release draft
on:
  push:
    branches: [fix/windows-startup-issue-3]
permissions:
  contents: write
jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22.20.0'
      - run: npm ci
      - run: npm run check
      - name: Build exact source archive and verify
        run: |
          test "$(node -p "require('./package.json').version")" = "0.5.3"
          git archive --format=zip --prefix=lapian-notes/ HEAD -o lapian-notes-v0.5.3.zip
          python3 - <<'PY'
          import zipfile, subprocess, json
          with zipfile.ZipFile('lapian-notes-v0.5.3.zip') as z:
              files = [n.removeprefix('lapian-notes/') for n in z.namelist() if not n.endswith('/')]
              tracked = subprocess.check_output(['git','ls-tree','-r','--name-only','HEAD'],text=True).splitlines()
              assert sorted(files) == sorted(tracked)
              pkg = json.loads(z.read('lapian-notes/package.json'))
              lock = json.loads(z.read('lapian-notes/package-lock.json'))
              assert pkg['version'] == lock['version'] == lock['packages']['']['version'] == '0.5.3'
              assert b'\r' not in z.read('lapian-notes/run.command')
              for f in ['run.bat','setup.ps1']:
                  b = z.read('lapian-notes/' + f)
                  assert b'\r\n' in b and b'\n' not in b.replace(b'\r\n', b'')
              print('Archive file list, version and line endings verified')
          PY
          sha256sum lapian-notes-v0.5.3.zip > SHA256SUMS.txt
      - name: Create draft only
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cat > release-notes.txt <<'NOTES'
          修复 Windows 下 Vite 已启动却被误判为启动失败的问题。
          清理地址中的终端颜色字符，支持实际端口识别，本地检测绕过代理，失败时清理本次进程并输出诊断。
          
          Windows Server 2025 上 PowerShell 5.1 的安装和启动测试已通过，包含彩色日志与端口切换。
          发布前仍需按 RELEASING.md 完成 Windows/macOS 桌面启动、浏览器及影片抽帧验证。
          此版本保持草稿，尚未公开发布。
          NOTES
          cat SHA256SUMS.txt >> release-notes.txt
          gh release create v0.5.3 lapian-notes-v0.5.3.zip SHA256SUMS.txt --draft --target "$GITHUB_SHA" --title "v0.5.3 Windows 启动修复" --notes-file release-notes.txt
